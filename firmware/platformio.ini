; Nanovolt divider Rev A firmware - ESP32 "Cheap Yellow Display" (ESP32-2432S028R family).
; Build:  pio run -d firmware            (all envs)
; Flash:  pio run -d firmware -e cyd -t upload

[platformio]
default_envs = cyd

[env]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@1.2.30
; Core log output would interleave with SCPI responses on the same serial port.
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DNVD_FW_VERSION=\"0.1.0\"

; Standard CYD: ILI9341 panel.
[env:cyd]
build_flags =
    ${env.build_flags}
    -DNVD_PANEL_ILI9341

; CYD2USB variant (two USB ports): ST7789 panel.
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DNVD_PANEL_ST7789

; No board needed: MCP23017 and TMP275 are simulated and every coil pulse is logged to the serial
; console. Use it to check relay sequencing before the board is connected.
[env:cyd_sim]
build_flags =
    ${env.build_flags}
    -DNVD_PANEL_ILI9341
    -DNVD_SIM_BOARD
